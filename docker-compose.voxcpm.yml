# =============================================================================
# VoxCPM 1.5 Backend — NOT YET PACKAGED
# =============================================================================
#
# This compose file references a `ghcr.io/loserbcc/voxcpm15:latest` image that
# was never published publicly. The original build hardcoded paths from the
# maintainer's workstation and was never genericized for release.
#
# Working alternatives today:
#   - docker-compose.kokoro.yml      → 67 voices, CPU-friendly
#   - docker-compose.vibevoice.yml   → real-time streaming TTS
#   - hosted alpha at lessfortts.loser.com (uses voxcpm in production)
#
# To package VoxCPM 1.5 yourself:
#   - Upstream source: https://github.com/OpenBMB/VoxCPM
#   - Community Docker images exist on Docker Hub (search "voxcpm15")
#     — vet before trusting; we have not audited them.
#
# When a clean public image ships, this file will be restored with a working
# `image:` reference. The stub below uses a `disabled` profile so
# `docker compose up` won't fail confusingly — it will report no services.
# =============================================================================

services:
  voxcpm:
    image: ghcr.io/loserbcc/voxcpm15:latest  # NOT PUBLISHED — see header
    profiles: ["disabled"]                   # prevent accidental `up`
    ports:
      - "7870:7870"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
